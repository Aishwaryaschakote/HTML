<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact me form</title>
</head>
<body>
    <h1>Contact Me Form</h1>
    <form >
        <label for="fname">Name:</label>
        <input type="text" placeholder="Enter your name" name="fname" id="fname" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" placeholder="xxxx@gmail.com" name="email" id="email"required>
        <br>
        <label for="phone">mob.no:</label>
        <input type="tel" placeholder="+91 xxxxx xxxxx" name="phone" id="phone" required> <br>
        <label for="address">Address:</label>
        <textarea name="address" id="address" placeholder="add your address" ></textarea> <br>
        <label for="query">Query:</label>
        <textarea placeholder="enter your query" name="query" id="query" required></textarea>
        <br>
        <button type="submit">submit</button>
    </form>
</body>
</html>
