<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images </title>
</head>
<body>
    <img src="team1.png" width="400px"  alt="no image">
    <img src="./images/team23.png" width="600px" height="400px" alt="no image">
    <!-- if img is in current folder then ./
     if in another forward folder then give path..
     if it's in backward folder then use those many dots and slash like ../
     don't use spaces while naming images. -->

    <picture>
        
        <source media="(min-width:650px)" srcset="./images/team32.png" />
        <source media="(min-width:650px)" srcset="./tea3m.png" />
        <img src="./team3.png" alt="">
    </picture>

    <!-- an image map generator -->
    <!-- Image Map Generated by http://www.image-map.net/ -->
    <img src="team.png" usemap="#image-map">

    <map name="image-map">
        <area onclick="one()" target="" alt="" title="" href="" coords="971,229,1533,765" shape="rect">
        <area onclick="two()" target="" alt="" title="" href="" coords="221,401,215" shape="circle">
    </map>

<script>
    function one(){
        alert("you clicked on one")
    }
    function two(){
        alert("you clicked on two")
    }
</script>
</body>
</html>
