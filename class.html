<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes</title>
    <style>
        .red{
            background-color: rgb(245, 92, 92);
        }
        #green{
            background-color: rgb(121, 230, 121);
        }
    </style>
</head>
<body>
    <!-- here red is a class in a file or page class can be used multiple times(able to target multiple elements) but id's has to be used only once and with one element only(target only one element) -->
    <p class="red">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Quod, modi!</p>

    <p id="green">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Quod, modi!</p>
    <h1 class="red">test 1</h1>
    <h3>test 2</h3>

    
</body>
</html>
