    <style>
        .red{

<body>
    <!-- here red is a class in a file or page class can be used multiple times(able to target multiple elements) but id's has to be used only once and with one element only(target only one element) -->

    <p id="green">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Quod, modi!</p>

    <h3>test 2</h3>

        </tr>
        <tr>
